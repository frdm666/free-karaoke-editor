# The example settings — the reference, not the file the program reads.
# Copy it to settings.ini next to this one (Install.bat / install.command do it
# for you on the first run) and edit the copy: settings.ini is yours, it is not
# in the repository, and an update never overwrites it.
# --- the copy starts below this line ---

# Settings for the launcher scripts. Change the value to the right of “=”.
# Lines starting with # are ignored. Missing file = defaults everywhere.
# Russian key names still work: движок, модель, язык, минусовка, цвета,
# оформление, надписи, кодек, встраивать, lrc.

# Timing engine: auto | whisper | energy
#   auto    — whisper if it is installed, otherwise energy
#   whisper — accurate, word by word, but slow and needs stable-ts
#   energy  — instant, line by line, no neural nets
align = auto

# Whisper model: tiny | base | small | medium | large-v3
#   Bigger is more accurate and slower.
#   small is a sensible compromise on a machine without a graphics card.
model = small

# Language of the lyrics: auto | ru | uk | en | de | fr | es | it | pl | pt | tr | ja | ko | zh
#   auto — worked out from the text itself and named in the output
language = auto

# Make an instrumental (needs demucs). yes | no
instrumental = yes

# Highlight colours: the main voice and the second one.
# Lines wholly inside round brackets count as the second voice.
colors = #4de1ff,#ff8ad1

# Page look: background and text colour.
# If the text blends into the background, the program lightens or darkens it.
theme = #0a0b14,#e8ebf5

# Language of the labels: auto | en | ru
#   auto — the browser's language for the finished page, the system's for the
#          program's own messages
ui-lang = auto

# Audio codec inside the HTML: mp3 | opus | aac
#   mp3  — plays everywhere
#   opus — file 2–3 times smaller, needs a modern browser
codec = mp3

# Embed the audio in the HTML. yes | no
#   no — the audio files are put next to the page (it stops being one file)
embed = yes

# Also save a .lrc file next to it. yes | no
lrc = no

# How the vocal is separated from the backing: htdemucs | htdemucs_ft
#   htdemucs_ft — four passes instead of one: a cleaner voice, and the timing
#                 is made from that voice. About four times longer.
separator = htdemucs

# Where yt-dlp is, when the program cannot find it on its own. A machine holds
# several Pythons: the one a terminal reaches and the one a double-clicked
# window finds are often not the same, and pip leaves yt-dlp beside whichever
# it belongs to. Point straight at the file and the guessing stops.
#   yt-dlp = /opt/homebrew/bin/yt-dlp
# yt-dlp =

# Extra keys for the downloader that takes the sound out of a link (yt-dlp).
# Empty is right for almost everyone. A video that asks you to sign in needs
# cookies: name the browser you are signed in with, and yt-dlp takes them
# itself, freshly, on every download.
#   yt-dlp-args = --cookies-from-browser firefox
# chrome and safari work too; firefox asks the fewest questions on a Mac.
# Do not keep an exported cookies.txt lying about, and never send one to
# anyone: those lines are the account itself — past the password and past the
# second factor. If one has been seen by someone else, change the password.
# yt-dlp-args =
